plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.quiosquelitoral.gunboundguide'
    compileSdk 23
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "com.quiosquelitoral.gunboundguide"
        minSdk 21
        targetSdk 23
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Sem dependências externas — apenas Android SDK puro
}
